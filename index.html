<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: oklch(97% 0.008 75);
    --bg-alt: oklch(94% 0.01 75);
    --bg-card: oklch(99% 0.004 75);
    --surface: oklch(100% 0 0);
    --ink: oklch(14% 0.012 60);
    --ink-2: oklch(35% 0.01 60);
    --ink-3: oklch(55% 0.008 60);
    --ink-4: oklch(72% 0.006 60);
    --border: oklch(87% 0.008 75);
    --border-strong: oklch(75% 0.01 75);
    --accent: oklch(44% 0.18 25);
    --accent-hover: oklch(38% 0.20 25);
    --accent-light: oklch(94% 0.04 25);
    --rule: oklch(78% 0.01 60);
    --font-serif: 'Frank Ruhl Libre', 'Playfair Display', Georgia, serif;
    --font-ui: 'Assistant', 'Helvetica Neue', Arial, sans-serif;
    --nav-h: 64px;
    --max-w: 1280px;
    transition: background 0.3s, color 0.3s;
  }

  [data-theme="dark"] {
    --bg: oklch(12% 0.010 240);
    --bg-alt: oklch(16% 0.012 240);
    --bg-card: oklch(18% 0.012 240);
    --surface: oklch(20% 0.014 240);
    --ink: oklch(95% 0.005 80);
    --ink-2: oklch(82% 0.006 80);
    --ink-3: oklch(65% 0.005 80);
    --ink-4: oklch(48% 0.005 80);
    --border: oklch(26% 0.010 240);
    --border-strong: oklch(34% 0.012 240);
    --accent: oklch(62% 0.18 25);
    --accent-hover: oklch(68% 0.20 25);
    --accent-light: oklch(22% 0.06 25);
    --rule: oklch(30% 0.010 240);
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  img { display: block; width: 100%; object-fit: cover; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; font-family: var(--font-ui); }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  /* ─── TOP BAR ─── */
  .top-bar {
    background: var(--ink);
    color: var(--bg);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 6px 0;
    text-align: center;
  }
  .top-bar span { opacity: 0.7; margin: 0 8px; }
  .top-bar a { color: var(--accent); }

  /* ─── NAVBAR ─── */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    height: var(--nav-h);
    transition: background 0.3s, border-color 0.3s, box-shadow 0.2s;
  }
  nav.scrolled { box-shadow: 0 2px 20px oklch(0% 0 0 / 0.08); }
  .nav-inner {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 24px;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 0;
  }
  .nav-logo {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nav-logo em {
    font-style: normal;
    color: var(--accent);
  }
  .nav-divider {
    width: 1px;
    height: 24px;
    background: var(--border-strong);
    margin: 0 20px;
    flex-shrink: 0;
  }
  .nav-links {
    display: flex;
    gap: 0;
    list-style: none;
    flex: 1;
  }
  .nav-links li a {
    display: block;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-2);
    line-height: var(--nav-h);
    border-bottom: 3px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .nav-links li a:hover, .nav-links li a.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: auto;
    margin-left: 0;
  }
  [dir="rtl"] .nav-actions { margin-right: auto; margin-left: 0; }

  .search-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--ink-3);
    transition: border-color 0.2s, background 0.2s;
    min-width: 180px;
  }
  .search-box:focus-within {
    border-color: var(--accent);
    background: var(--surface);
  }
  .search-box input {
    background: none;
    border: none;
    outline: none;
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--ink);
    flex: 1;
    min-width: 0;
  }
  .search-box input::placeholder { color: var(--ink-4); }
  .search-icon { color: var(--ink-4); font-size: 14px; flex-shrink: 0; }

  .theme-toggle {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-2);
    font-size: 16px;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    flex-shrink: 0;
  }
  .theme-toggle:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ─── DATE BAR ─── */
  .date-bar {
    border-bottom: 1.5px solid var(--border);
    padding: 8px 0;
  }
  .date-bar-inner {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--ink-3);
    font-family: var(--font-ui);
  }
  .date-bar-left { font-weight: 600; }
  .date-bar-cats { display: flex; gap: 16px; }
  .date-bar-cats a {
    color: var(--ink-3);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .date-bar-cats a:hover { color: var(--accent); }

  /* ─── HERO ─── */
  .hero-section {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 32px 24px 0;
    border-bottom: 1.5px solid var(--border);
    padding-bottom: 32px;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto auto;
    gap: 0 32px;
  }
  .hero-main { grid-column: 1; grid-row: 1 / 3; }
  .hero-main a { display: block; }
  .hero-main-img {
    aspect-ratio: 16/9;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .hero-main-img img {
    height: 100%;
    transition: transform 0.5s ease;
  }
  .hero-main:hover .hero-main-img img { transform: scale(1.03); }
  .hero-tag {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-bottom: 12px;
  }
  .hero-main-title {
    font-family: var(--font-serif);
    font-size: clamp(26px, 3vw, 38px);
    font-weight: 700;
    line-height: 1.25;
    color: var(--ink);
    margin-bottom: 12px;
    text-wrap: pretty;
  }
  .hero-main:hover .hero-main-title { color: var(--accent); }
  .hero-main-excerpt {
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink-2);
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-3);
    font-weight: 600;
  }
  .hero-meta-dot { color: var(--rule); }

  /* Hero side stack */
  .hero-side { display: flex; flex-direction: column; gap: 0; }
  .hero-side-item {
    display: flex;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .hero-side-item:first-child { padding-top: 0; }
  .hero-side-item:last-child { border-bottom: none; }
  .hero-side-img {
    width: 88px;
    height: 66px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .hero-side-img img { height: 100%; transition: transform 0.3s; }
  .hero-side-item:hover .hero-side-img img { transform: scale(1.05); }
  .hero-side-content { flex: 1; min-width: 0; }
  .hero-side-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 5px;
  }
  .hero-side-title {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--ink);
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hero-side-item:hover .hero-side-title { color: var(--accent); }
  .hero-side-meta { font-size: 12px; color: var(--ink-4); }

  /* ─── SECTION HEADER ─── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }
  .section-header-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .section-header-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-header-title::before {
    content: '';
    display: block;
    width: 4px;
    height: 22px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .section-header-more {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: opacity 0.2s;
  }
  .section-header-more:hover { opacity: 0.75; }

  /* ─── MAIN LAYOUT ─── */
  .main-content {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 40px 24px;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 48px;
    align-items: start;
  }

  /* ─── CARD GRID ─── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border);
    transition: box-shadow 0.25s, transform 0.25s, border-color 0.25s;
    cursor: pointer;
  }
  .card:hover {
    box-shadow: 0 6px 28px oklch(0% 0 0 / 0.10);
    transform: translateY(-3px);
    border-color: var(--border-strong);
  }
  .card-img { aspect-ratio: 16/10; overflow: hidden; }
  .card-img img { height: 100%; transition: transform 0.5s ease; }
  .card:hover .card-img img { transform: scale(1.06); }
  .card-body { padding: 16px 18px 20px; flex: 1; display: flex; flex-direction: column; }
  .card-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .card-title {
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--ink);
    margin-bottom: 10px;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-wrap: pretty;
  }
  .card:hover .card-title { color: var(--accent); }
  .card-excerpt {
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--ink-3);
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-4);
    font-weight: 600;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: auto;
  }
  .card-meta-dot { color: var(--rule); }

  /* ─── LIST CARDS (for article page sidebar or additional) ─── */
  .list-card {
    display: flex;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .list-card:last-child { border-bottom: none; }
  .list-card:hover { opacity: 0.8; }
  .list-card-img {
    width: 80px;
    height: 60px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .list-card-img img { height: 100%; }
  .list-card-title {
    font-family: var(--font-serif);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .list-card:hover .list-card-title { color: var(--accent); }
  .list-card-meta { font-size: 12px; color: var(--ink-4); }

  /* ─── SIDEBAR ─── */
  .sidebar { display: flex; flex-direction: column; gap: 32px; }
  .sidebar-widget {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 20px;
  }
  .sidebar-widget-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .newsletter-form { display: flex; flex-direction: column; gap: 10px; }
  .newsletter-desc { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); margin-bottom: 4px; }
  .newsletter-input {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    text-align: right;
    direction: rtl;
  }
  .newsletter-input:focus { border-color: var(--accent); }
  .newsletter-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 700;
    font-family: var(--font-ui);
    cursor: pointer;
    transition: background 0.2s;
    border-radius: 2px;
  }
  .newsletter-btn:hover { background: var(--accent-hover); }

  .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-pill {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .tag-pill:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ─── ARTICLE PAGE ─── */
  .article-page { display: none; }
  .article-page.active { display: block; }
  .article-header {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 40px 24px 0;
    max-width: 860px;
  }
  .article-breadcrumb {
    font-size: 13px;
    color: var(--ink-3);
    margin-bottom: 20px;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .article-breadcrumb a { color: var(--accent); font-weight: 600; }
  .article-cat {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    margin-bottom: 18px;
  }
  .article-title {
    font-family: var(--font-serif);
    font-size: clamp(28px, 4vw, 46px);
    font-weight: 900;
    line-height: 1.2;
    color: var(--ink);
    margin-bottom: 18px;
    text-wrap: pretty;
    max-width: 780px;
  }
  .article-subtitle {
    font-size: 19px;
    line-height: 1.6;
    color: var(--ink-2);
    margin-bottom: 20px;
    max-width: 700px;
    font-family: var(--font-serif);
    font-weight: 400;
    font-style: italic;
  }
  .article-meta-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    font-size: 14px;
    color: var(--ink-3);
  }
  .article-author { font-weight: 700; color: var(--ink); }
  .article-meta-dot { color: var(--rule); }
  .article-hero-img {
    max-width: 860px;
    margin: 0 auto 40px;
    padding: 0 24px;
  }
  .article-hero-img img { width: 100%; aspect-ratio: 16/8; object-fit: cover; }
  .article-img-caption {
    font-size: 12px;
    color: var(--ink-4);
    margin-top: 8px;
    font-style: italic;
    text-align: center;
  }
  .article-body {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 40px;
    align-items: start;
  }
  .article-text { font-size: 17px; line-height: 1.8; color: var(--ink-2); }
  .article-text p { margin-bottom: 22px; }
  .article-text h2 {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    margin: 32px 0 14px;
    border-right: 4px solid var(--accent);
    padding-right: 14px;
  }
  .article-text blockquote {
    border-right: 4px solid var(--accent);
    padding: 16px 20px;
    margin: 28px 0;
    background: var(--accent-light);
    font-family: var(--font-serif);
    font-size: 19px;
    font-style: italic;
    color: var(--ink);
    line-height: 1.6;
  }
  .article-reading-bar {
    position: fixed;
    top: var(--nav-h);
    right: 0;
    left: 0;
    height: 3px;
    background: var(--border);
    z-index: 99;
  }
  .article-reading-progress {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.1s;
  }

  /* ─── FOOTER ─── */
  footer {
    background: var(--ink);
    color: var(--bg);
    padding: 48px 24px 24px;
    margin-top: 64px;
  }
  .footer-inner {
    max-width: var(--max-w);
    margin: 0 auto;
  }
  .footer-top {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr;
    gap: 40px;
    padding-bottom: 36px;
    border-bottom: 1px solid oklch(30% 0.008 60);
    margin-bottom: 24px;
  }
  .footer-brand-name {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .footer-brand-name em { font-style: normal; color: var(--accent); }
  .footer-desc { font-size: 14px; line-height: 1.7; opacity: 0.65; }
  .footer-col-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 14px;
  }
  .footer-links { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .footer-links a { font-size: 14px; opacity: 0.75; transition: opacity 0.2s; }
  .footer-links a:hover { opacity: 1; }
  .footer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    opacity: 0.5;
  }

  /* ─── PAGE TRANSITIONS ─── */
  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ─── SHARE BUTTONS ─── */
  .share-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin: 40px 0 0;
    flex-wrap: wrap;
  }
  .share-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-3);
    margin-left: 4px;
  }
  .share-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 4px;
    border: 1.5px solid var(--border);
    background: var(--bg-card);
    color: var(--ink-2);
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-ui);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
    text-decoration: none;
  }
  .share-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .share-btn.copied { border-color: #16a34a; color: #16a34a; background: oklch(97% 0.04 150); }

  /* ─── SAVE BUTTON ─── */
  .save-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 4px;
    border: 1.5px solid var(--border);
    background: var(--bg-card);
    color: var(--ink-2);
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-ui);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .save-btn.saved { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* ─── RELATED POSTS ─── */
  .related-section {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 64px;
    border-top: 2px solid var(--border);
  }
  .related-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-top: 20px;
  }
  @media (max-width: 680px) { .related-grid { grid-template-columns: 1fr; } }

  /* ─── BACK TO TOP ─── */
  .back-to-top {
    position: fixed;
    bottom: 32px;
    left: 32px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px oklch(0% 0 0 / 0.18);
    transition: transform 0.2s, opacity 0.3s;
    opacity: 0;
    pointer-events: none;
  }
  .back-to-top.visible { opacity: 1; pointer-events: auto; }
  .back-to-top:hover { transform: translateY(-3px); }

  /* ─── TOOL PAGES ─── */
  .tool-page { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }
  .tool-breadcrumb { font-size: 13px; color: var(--ink-3); margin-bottom: 24px; display: flex; gap: 6px; }
  .tool-breadcrumb a { color: var(--accent); font-weight: 600; }
  .tool-title { font-family: var(--font-serif); font-size: clamp(26px,4vw,38px); font-weight: 900; color: var(--ink); margin-bottom: 8px; }
  .tool-subtitle { font-size: 16px; color: var(--ink-3); margin-bottom: 36px; }

  /* Token Counter */
  .token-textarea {
    width: 100%; min-height: 180px; padding: 16px;
    font-family: var(--font-ui); font-size: 15px; line-height: 1.7;
    border: 1.5px solid var(--border); background: var(--bg); color: var(--ink);
    resize: vertical; outline: none; border-radius: 4px;
    transition: border-color 0.2s;
  }
  .token-textarea:focus { border-color: var(--accent); }
  .token-stats { display: flex; gap: 20px; margin: 10px 0 28px; font-size: 13px; color: var(--ink-3); flex-wrap: wrap; }
  .token-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .token-card {
    background: var(--bg-card); border: 1px solid var(--border); padding: 20px;
    border-radius: 4px; transition: border-color 0.2s;
  }
  .token-card:hover { border-color: var(--border-strong); }
  .token-card-provider { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .token-card-model { font-family: var(--font-serif); font-size: 15px; font-weight: 700; margin-bottom: 14px; }
  .token-card-count { font-size: 38px; font-weight: 900; font-family: var(--font-serif); line-height: 1; color: var(--ink); }
  .token-card-label { font-size: 11px; color: var(--ink-4); margin: 3px 0 14px; }
  .token-card-cost { border-top: 1px solid var(--border); padding-top: 12px; }
  .token-card-cost-val { font-size: 17px; font-weight: 700; color: var(--accent); }
  .token-card-cost-rate { font-size: 11px; color: var(--ink-4); margin-top: 2px; }

  /* Cost Calculator */
  .cost-inputs { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 32px; }
  @media (max-width: 620px) { .cost-inputs { grid-template-columns: 1fr; } }
  .cost-input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-3); margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; }
  .cost-input-group input {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px;
    border-radius: 4px; outline: none; transition: border-color 0.2s; text-align: left; direction: ltr;
  }
  .cost-input-group input:focus { border-color: var(--accent); }
  .cost-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .cost-table th { text-align: right; padding: 10px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); border-bottom: 2px solid var(--border); }
  .cost-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .cost-table tr:hover td { background: var(--bg-alt); }
  .cost-bar { height: 6px; border-radius: 3px; background: var(--accent); transition: width 0.4s ease; min-width: 4px; }
  .cost-bar-wrap { background: var(--border); border-radius: 3px; overflow: hidden; width: 120px; }
  .export-btn { margin-top: 20px; padding: 10px 22px; background: var(--accent); color: white; border: none; font-family: var(--font-ui); font-size: 14px; font-weight: 700; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
  .export-btn:hover { background: var(--accent-hover); }

  /* Prompt Library */
  .prompt-search-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .prompt-search-input {
    flex: 1; min-width: 200px; padding: 10px 14px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px;
    border-radius: 4px; outline: none; transition: border-color 0.2s; direction: rtl;
  }
  .prompt-search-input:focus { border-color: var(--accent); }
  .cat-filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat-btn { padding: 7px 14px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--ink-2); font-size: 13px; font-weight: 600; border-radius: 4px; cursor: pointer; transition: all 0.15s; font-family: var(--font-ui); }
  .cat-btn.active, .cat-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .prompt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .prompt-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 4px; display: flex; flex-direction: column; transition: border-color 0.2s, box-shadow 0.2s; }
  .prompt-card:hover { border-color: var(--border-strong); box-shadow: 0 4px 16px oklch(0% 0 0 / 0.07); }
  .prompt-cat-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .prompt-card-title { font-family: var(--font-serif); font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .prompt-card-desc { font-size: 13px; color: var(--ink-3); margin-bottom: 14px; flex: 1; }
  .prompt-preview { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-height: 80px; overflow: hidden; margin-bottom: 14px; direction: rtl; text-align: right; position: relative; }
  .prompt-preview::after { content: ''; position: absolute; bottom: 0; right: 0; left: 0; height: 28px; background: linear-gradient(transparent, var(--bg)); }
  .prompt-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .prompt-tag { font-size: 11px; background: var(--bg-alt); border: 1px solid var(--border); color: var(--ink-3); padding: 2px 8px; border-radius: 10px; }
  .prompt-copy-btn { padding: 8px 0; border: 1.5px solid var(--accent); color: var(--accent); background: transparent; font-family: var(--font-ui); font-size: 13px; font-weight: 700; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .prompt-copy-btn:hover, .prompt-copy-btn.copied { background: var(--accent); color: white; }

  /* Model Comparison */
  .model-filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .model-filter-label { font-size: 12px; font-weight: 700; color: var(--ink-3); margin-left: 4px; }
  .model-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .model-table { width: 100%; border-collapse: collapse; font-size: 13.5px; white-space: nowrap; }
  .model-table th { text-align: right; padding: 10px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; background: var(--bg-card); }
  .model-table th:hover { color: var(--accent); }
  .model-table th .sort-arrow { margin-right: 4px; opacity: 0.4; }
  .model-table th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  .model-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .model-table tr:hover td { background: var(--bg-alt); }
  .model-name { font-weight: 700; color: var(--ink); }
  .model-provider { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .badge-yes { background: oklch(92% 0.06 145); color: oklch(36% 0.14 145); }
  .badge-no  { background: var(--bg-alt); color: var(--ink-4); }

  /* Tools Landing Cards */
  .tool-landing-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; margin-bottom: 56px; }
  @media (max-width: 640px) { .tool-landing-grid { grid-template-columns: 1fr; } .token-cards { grid-template-columns: repeat(2,1fr); } }
  .tool-landing-card {
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 28px; border-radius: 4px; cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    text-align: right;
  }
  .tool-landing-card:hover { border-color: var(--accent); box-shadow: 0 6px 24px oklch(0% 0 0 / 0.09); transform: translateY(-2px); }
  .tool-landing-icon { font-size: 32px; margin-bottom: 14px; }
  .tool-landing-name { font-family: var(--font-serif); font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .tool-landing-desc { font-size: 14px; color: var(--ink-3); line-height: 1.6; }
  .tool-landing-arrow { margin-top: 16px; font-size: 13px; color: var(--accent); font-weight: 700; }

  /* ─── SAVED PAGE EMPTY STATE ─── */
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--ink-3);
  }
  .empty-state svg { margin: 0 auto 16px; opacity: 0.3; }
  .empty-state h2 { font-family: var(--font-serif); font-size: 22px; color: var(--ink-2); margin-bottom: 10px; }
  .empty-state p { font-size: 15px; line-height: 1.6; }

  /* ─── ABOUT PAGE ─── */
  .about-hero {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 64px 24px;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 64px;
    align-items: center;
  }
  .about-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .about-title {
    font-family: var(--font-serif);
    font-size: clamp(32px, 4vw, 52px);
    font-weight: 900;
    line-height: 1.15;
    color: var(--ink);
    margin-bottom: 20px;
  }
  .about-body { font-size: 17px; line-height: 1.8; color: var(--ink-2); }
  .about-body p { margin-bottom: 18px; }
  .about-img-box {
    aspect-ratio: 3/4;
    overflow: hidden;
    background: var(--bg-alt);
  }
  .about-img-placeholder {
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      45deg,
      var(--border) 0px,
      var(--border) 1px,
      transparent 1px,
      transparent 10px
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    font-size: 12px;
    color: var(--ink-4);
    text-align: center;
    padding: 20px;
  }
  .stats-row {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 24px 64px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }
  .stat-cell {
    background: var(--bg-card);
    padding: 32px;
    text-align: center;
  }
  .stat-num {
    font-family: var(--font-serif);
    font-size: 48px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 8px;
  }
  .stat-label { font-size: 14px; color: var(--ink-3); font-weight: 600; }

  /* ─── GLOSSARY PAGE ─── */
  .glossary-letter-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 28px; }
  .letter-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--ink-2); font-size: 15px; font-weight: 700; border-radius: 4px; cursor: pointer; transition: all 0.15s; font-family: var(--font-serif); }
  .letter-btn:hover, .letter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .letter-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }
  .glossary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .glossary-term-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 4px; transition: border-color 0.2s; }
  .glossary-term-card:hover { border-color: var(--border-strong); }
  .glossary-cat-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .glossary-term { font-family: var(--font-serif); font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .glossary-term-en { font-size: 12px; color: var(--ink-4); margin-bottom: 10px; }
  .glossary-short { font-size: 14px; color: var(--ink-2); line-height: 1.6; margin-bottom: 12px; }
  .glossary-toggle-btn { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; font-family: var(--font-ui); font-weight: 700; padding: 0; }
  .glossary-full { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

  /* ─── WEEKLY PAGE ─── */
  .weekly-issue-list { display: flex; flex-direction: column; gap: 20px; }
  .weekly-issue-card { background: var(--bg-card); border: 1px solid var(--border); padding: 24px; border-radius: 4px; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
  .weekly-issue-card:hover { border-color: var(--accent); box-shadow: 0 4px 20px oklch(0% 0 0 / 0.08); }
  .weekly-issue-meta { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 8px; letter-spacing: 0.05em; text-transform: uppercase; }
  .weekly-issue-title { font-family: var(--font-serif); font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .weekly-issue-summary { font-size: 14px; color: var(--ink-3); line-height: 1.6; margin-bottom: 14px; }
  .weekly-issue-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .weekly-item-list { display: flex; flex-direction: column; gap: 0; }
  .weekly-item { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border); }
  .weekly-item:last-child { border-bottom: none; }
  .weekly-item-type { flex-shrink: 0; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--bg-alt); color: var(--ink-3); border: 1px solid var(--border); white-space: nowrap; height: fit-content; margin-top: 3px; }
  .weekly-item-type.hot { background: oklch(95% 0.05 25); color: var(--accent); border-color: oklch(88% 0.08 25); }
  .weekly-item-title { font-weight: 700; color: var(--ink); margin-bottom: 4px; font-size: 15px; }
  .weekly-item-desc { font-size: 13.5px; color: var(--ink-3); line-height: 1.6; }

  /* ─── ABOUT EXTENDED ─── */
  .about-section { max-width: 860px; margin: 0 auto; padding: 0 24px 48px; }
  .about-section-title { font-family: var(--font-serif); font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--accent); }
  .expertise-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
  .expertise-card { background: var(--bg-card); border: 1px solid var(--border); padding: 18px; border-radius: 4px; }
  .expertise-icon { font-size: 28px; margin-bottom: 10px; }
  .expertise-name { font-weight: 700; color: var(--ink); margin-bottom: 6px; font-size: 15px; }
  .expertise-desc { font-size: 13px; color: var(--ink-3); line-height: 1.55; }
  .pub-list { list-style: none; display: flex; flex-direction: column; gap: 0; }
  .pub-item { display: flex; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .pub-item:last-child { border-bottom: none; padding-bottom: 0; }
  .pub-year { font-size: 12px; font-weight: 700; color: var(--accent); width: 40px; flex-shrink: 0; padding-top: 2px; }
  .pub-title { font-weight: 700; color: var(--ink); margin-bottom: 3px; font-size: 14px; }
  .pub-where { font-size: 13px; color: var(--ink-3); }

// ─── TOC HELPERS ────────────────────────────────────────────────────────────

function processBodyWithIds(html) {
  let idx = 0;
  const headings = [];
  const processed = html.replace(/<(h[23])([^>]*)>([\s\S]*?)<\/h[23]>/gi, (_, tag, attrs, inner) => {
    const id = `sec-${idx++}`;
    const text = inner.replace(/<[^>]+>/g, '').trim();
    headings.push({ id, text, level: parseInt(tag[1]) });
    return `<${tag}${attrs} id="${id}">${inner}</${tag}>`;
  });
  return { html: processed, headings };
}

function TOCWidget({ headings }) {
  const [activeId, setActiveId] = React.useState(null);

  React.useEffect(() => {
    if (!headings.length) return;
    const io = new IntersectionObserver(
      entries => {
        entries.forEach(e => { if (e.isIntersecting) setActiveId(e.target.id); });
      },
      { rootMargin: '-15% 0px -70% 0px' }
    );
    headings.forEach(h => { const el = document.getElementById(h.id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, [headings]);

  if (headings.length < 3) return null;

  return (
    <div className="sidebar-widget">
      <div className="sidebar-widget-title" style={{fontSize:'13px'}}>תוכן עניינים</div>
      <nav aria-label="תוכן עניינים">
        {headings.map(h => (
          <a
            key={h.id}
            href={`#${h.id}`}
            onClick={e => { e.preventDefault(); document.getElementById(h.id)?.scrollIntoView({ behavior: 'smooth' }); }}
            style={{
              display: 'block',
              fontSize: h.level === 3 ? '12px' : '13px',
              padding: h.level === 3 ? '3px 20px 3px 0' : '4px 10px 4px 0',
              borderRight: h.level === 2 ? '2px solid var(--accent)' : '2px solid transparent',
              color: activeId === h.id ? 'var(--accent)' : 'var(--ink-2)',
              fontWeight: activeId === h.id ? '700' : '400',
              transition: 'color 0.15s',
              textDecoration: 'none',
            }}
          >
            {h.text}
          </a>
        ))}
      </nav>
    </div>
  );
}

// ─── TOKEN ESTIMATION ────────────────────────────────────────────────────────

function estimateTokens(text) {
  if (!text.trim()) return 0;
  const hebrewChars = (text.match(/[֐-׿]/g) || []).length;
  const otherChars  = text.length - hebrewChars;
  return Math.max(1, Math.round(hebrewChars / 1.8 + otherChars / 3.8));
}

/* ── 3.2 Cost Calculator ── */
function CostCalculatorPage({ onNav }) {
  const [inputTok,  setInputTok]  = useState(1000);
  const [outputTok, setOutputTok] = useState(500);
  const [reqDay,    setReqDay]    = useState(100);

  const rows = PRICING_DATA.map(m => {
    const costPerReq = (inputTok / 1_000_000) * m.inputPer1M + (outputTok / 1_000_000) * m.outputPer1M;
    const daily   = costPerReq * reqDay;
    const monthly = daily * 30;
    const yearly  = daily * 365;
    return { ...m, daily, monthly, yearly };
  }).sort((a, b) => a.monthly - b.monthly);

  const maxMonthly = Math.max(...rows.map(r => r.monthly), 0.0001);

  const exportCSV = () => {
    const header = 'מודל,ספק,יומי ($),חודשי ($),שנתי ($)';
    const lines  = rows.map(r => `"${r.name}","${r.provider}",${r.daily.toFixed(4)},${r.monthly.toFixed(2)},${r.yearly.toFixed(2)}`);
    const blob   = new Blob([[header, ...lines].join('\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'ai-cost-comparison.csv'; a.click();
  };

  const numInput = (val, set) => (
    <input type="number" min="0" value={val}
      onChange={e => set(Math.max(0, parseInt(e.target.value) || 0))} />
  );

  return (
    <div className="page active">
      <div className="tool-page">
        <ToolBreadcrumb onNav={onNav} current="מחשבון עלויות" />
        <h1 className="tool-title">מחשבון עלויות AI</h1>
        <p className="tool-subtitle">השווה עלויות חודשיות ושנתיות בין כל מודלי ה-AI המובילים</p>

        <div className="cost-inputs">
          <div className="cost-input-group"><label>טוקני קלט לבקשה</label>{numInput(inputTok, setInputTok)}</div>
          <div className="cost-input-group"><label>טוקני פלט לבקשה</label>{numInput(outputTok, setOutputTok)}</div>
          <div className="cost-input-group"><label>בקשות ביום</label>{numInput(reqDay, setReqDay)}</div>
        </div>

        <div className="model-table-wrap">
          <table className="cost-table">
            <thead>
              <tr>
                <th>מודל</th><th>ספק</th>
                <th>יומי</th><th>חודשי</th><th>שנתי</th><th>השוואה</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.id}>
                  <td style={{fontWeight:700}}>{r.name}</td>
                  <td style={{color:'var(--ink-3)',fontSize:'12px'}}>{r.provider}</td>
                  <td>${r.daily   < 0.01 ? r.daily.toFixed(4)   : r.daily.toFixed(2)}</td>
                  <td style={{fontWeight:700}}>${r.monthly < 1 ? r.monthly.toFixed(3) : r.monthly.toFixed(2)}</td>
                  <td>${r.yearly  < 1 ? r.yearly.toFixed(2)  : r.yearly.toFixed(0)}</td>
                  <td>
                    <div className="cost-bar-wrap">
                      <div className="cost-bar" style={{width:`${Math.max(4,(r.monthly/maxMonthly)*100)}%`,background:r.color}} />
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <button className="export-btn" onClick={exportCSV} aria-label="ייצא כ-CSV">⬇ ייצא כ-CSV</button>
      </div>
    </div>
  );
}

  const [query,   setQuery]   = useState('');

function ModelComparisonPage({ onNav }) {

    .sort((a, b) => {

function useSaved() {
  const [saved, setSaved] = useState(() => {
    try { return JSON.parse(localStorage.getItem('blog-saved') || '[]'); } catch { return []; }
  });
  const toggle = (article) => setSaved(prev => {
    const next = prev.some(a => a.id === article.id)
      ? prev.filter(a => a.id !== article.id)
      : [...prev, { id: article.id, title: article.title, excerpt: article.excerpt, date: article.date, category: article.category, catEn: article.catEn, img: article.img, readTime: article.readTime, tags: article.tags }];
    localStorage.setItem('blog-saved', JSON.stringify(next));
    return next;
  });
  const isSaved = (id) => saved.some(a => a.id === id);
  return { saved, toggle, isSaved };
}

function ShareButtons({ article }) {

  const url = `https://erezfinkel.github.io/#article-${article.id}`;

function ArticlePage({ article, onBack, onArticle, isSaved, toggleSaved }) {
  useEffect(() => { window.scrollTo(0, 0); }, [article]);

  // Inject article JSON-LD into <head> and clean up on unmount / article change
  useEffect(() => {
    const tag = document.createElement('script');
    tag.type = 'application/ld+json';
    tag.id = 'article-jsonld';
    tag.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Article",
          "headline": article.title,
          "description": article.excerpt,
          "image": article.img,
          "url": `https://erezfinkel.github.io/#article-${article.id}`,
          "inLanguage": "he",
          "author": {
            "@type": "Person",
            "@id": "https://erezfinkel.github.io/#author",
            "name": "ארז פינקל"
          },
          "publisher": {
            "@type": "Organization",
            "name": "בלוג ה-AI של ארז",
            "url": "https://erezfinkel.github.io"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "ראשי", "item": "https://erezfinkel.github.io" },
            { "@type": "ListItem", "position": 2, "name": article.category, "item": `https://erezfinkel.github.io/#${article.catEn.toLowerCase()}` },
            { "@type": "ListItem", "position": 3, "name": article.title, "item": `https://erezfinkel.github.io/#article-${article.id}` }
          ]
        }
      ]
    });
    document.getElementById('article-jsonld')?.remove();
    document.head.appendChild(tag);
    return () => document.getElementById('article-jsonld')?.remove();
  }, [article]);

  const rawBody = `
    <p>${article.excerpt}</p>
    <p>מאז שהבינה המלאכותית נכנסה לחיינו בצורה כה מאסיבית, הדיון על השפעותיה הפך לאחד הדיונים המרכזיים בזירה הטכנולוגית הגלובלית. אנחנו עדים לשינוי עמוק לא רק בכלים שבהם אנחנו משתמשים, אלא בדרך שבה אנחנו חושבים, עובדים ומקבלים החלטות.</p>
    <h2>הרקע לאירוע</h2>
    <p>הפיתוחים האחרונים בתחום מצביעים על מגמה ברורה: יותר ויותר חברות משלבות יכולות AI ישירות בתשתיות קריטיות, מה שמעלה שאלות רגולטוריות מורכבות שהממשלות עדיין מנסות להשיב עליהן.</p>
    <blockquote>"AI הוא לא עוד כלי — הוא שינוי פרדיגמה שמאתגר את כל מה שידענו על אוטומציה ואינטליגנציה."</blockquote>
    <p>המחקרים האחרונים מראים כי הטמעה נכונה של AI יכולה להגדיל פריון ב-40% ויותר, אך המפתח נמצא בגישה האסטרטגית ובהכשרת האנשים.</p>
    <h2>מה זה אומר בפרקטיקה</h2>
    <p>ארגונים שמצליחים להטמיע AI בצורה אפקטיבית משתפים מספר מאפיינים משותפים: מנהיגות שמאמינה בטכנולוגיה, תרבות של ניסוי ולמידה, ותשומת לב מיוחדת לאיכות הנתונים.</p>
    <h2>מה הלאה?</h2>
    <p>המגמות מראות שהשנים הקרובות יהיו מכוננות. הכלים שמגיעים כיום לשוק יעצבו את אופי העבודה, היצירה וקבלת ההחלטות לדור הבא.</p>
  `;

  const { html: body, headings } = processBodyWithIds(rawBody);

  return (
    <div className="page active">
      <ArticleReadingBar />
      <div className="article-header" style={{maxWidth:'860px',margin:'0 auto',padding:'40px 24px 0'}}>
        <div className="article-breadcrumb">
          <a href="#" onClick={e => { e.preventDefault(); onBack(); }}>← חזרה</a>
          <span>/</span>
          <span>{article.category}</span>
        </div>
        <div className="article-cat">{article.catEn}</div>
        <h1 className="article-title">{article.title}</h1>
        <p className="article-subtitle">{article.excerpt}</p>
        <div className="article-meta-bar">
          <span className="article-author">ארז פינקל</span>
          <span className="article-meta-dot">·</span>
          <span>{article.date}</span>
          <span className="article-meta-dot">·</span>
          <span>{article.readTime} קריאה</span>
          <button
            className={`save-btn${isSaved(article.id) ? ' saved' : ''}`}
            onClick={() => toggleSaved(article)}
            aria-label={isSaved(article.id) ? 'הסר מהשמורים' : 'שמור לקריאה מאוחר יותר'}
            style={{ marginRight: 'auto' }}
          >
            <IconBookmark filled={isSaved(article.id)} />
            {isSaved(article.id) ? 'שמור ✓' : 'שמור'}
          </button>
        </div>
      </div>
      <div className="article-hero-img">
        <img src={article.img} alt={article.title} />
        <div className="article-img-caption">תמונה: Unsplash</div>
      </div>
      <div className="article-body">
        <div>
          <div className="article-text" dangerouslySetInnerHTML={{ __html: body }} />
          <ShareButtons article={article} />
        </div>
        <aside className="sidebar" style={{position:'sticky',top:'calc(var(--nav-h) + 20px)'}}>
          <TOCWidget headings={headings} />
          <div className="sidebar-widget">
            <div className="sidebar-widget-title">ניוזלטר</div>
            <div className="newsletter-form">
              <p className="newsletter-desc">קבלו עדכונים שבועיים על AI ישירות למייל.</p>
              <input className="newsletter-input" type="email" placeholder="המייל שלכם" aria-label="כתובת מייל להרשמה לניוזלטר" />
              <button className="newsletter-btn">הרשמה</button>
            </div>
          </div>
          <div className="sidebar-widget">
            <div className="sidebar-widget-title">קראו גם</div>
            {ARTICLES.filter(a => a.id !== article.id).slice(0,3).map(a => (
              <div className="list-card" key={a.id}>
                <div className="list-card-img"><img src={a.img} alt={a.title} /></div>
                <div>
                  <div className="list-card-title">{a.title}</div>
                  <div className="list-card-meta">{a.date}</div>
                </div>
              </div>
            ))}
          </div>
        </aside>
      </div>
      <RelatedPosts article={article} onArticle={onArticle} />
    </div>
  );
}

  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const tweaksResult = useTweaks(TWEAK_DEFAULTS);
  const tweaks = tweaksResult?.tweaks ?? TWEAK_DEFAULTS;
  const setTweak = tweaksResult?.setTweak ?? (() => {});
  const [page, setPage] = useState('home');
  const [article, setArticle] = useState(null);
  const [weeklyIssue, setWeeklyIssue] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');
  const { saved, toggle: toggleSaved, isSaved } = useSaved();

  const dark = tweaks.darkMode;

  // Apply theme
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);

  // Apply accent color
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accentColor);
  }, [tweaks.accentColor]);

  // Apply font
  useEffect(() => {
    document.documentElement.style.setProperty('--font-serif', `'${tweaks.fontBody}', Georgia, serif`);
  }, [tweaks.fontBody]);

  const handleNav = (id) => {
    setPage(id);
    setArticle(null);
    setWeeklyIssue(null);
    setSearchQuery('');
    window.scrollTo(0,0);
  };

  const handleWeeklyIssue = (issue) => {
    setWeeklyIssue(issue);
    setPage('weekly-issue');
    window.scrollTo(0,0);
  };

  const handleArticle = (a) => {
    setArticle(a);
    setPage('article');
    window.scrollTo(0,0);
  };

  const handleSearch = (q) => {
    setSearchQuery(q);
    if (q && page !== 'home') setPage('home');
  };

  return (
    <>
      {tweaks.showTopBar && (
        <div className="top-bar">
          <span>חדש:</span> GPT-5.5 הגיע — <a href="#">קראו את הסקירה המלאה</a>
          <span>|</span>
          <span>גוגל תשקיע 40B$ ב-Anthropic</span>
        </div>
      )}
      <NavBar
        dark={dark}
        toggleDark={() => setTweak('darkMode', !dark)}
        onNav={handleNav}
        page={page}
        searchQuery={searchQuery}
        setSearchQuery={handleSearch}
        savedCount={saved.length}
      />
      {page === 'home'         && <HomePage onArticle={handleArticle} searchQuery={searchQuery} />}
      {page === 'article'      && article && <ArticlePage article={article} onBack={() => handleNav('home')} onArticle={handleArticle} isSaved={isSaved} toggleSaved={toggleSaved} />}
      {page === 'news'         && <NewsPage onArticle={handleArticle} />}
      {page === 'guides'       && <GuidesPage onArticle={handleArticle} />}
      {page === 'tools'        && <ToolsPage onNav={handleNav} />}
      {page === 'tool-token'   && <TokenCounterPage   onNav={handleNav} />}
      {page === 'tool-cost'    && <CostCalculatorPage onNav={handleNav} />}
      {page === 'tool-prompts' && <PromptLibraryPage  onNav={handleNav} />}
      {page === 'tool-models'  && <ModelComparisonPage onNav={handleNav} />}
      {page === 'glossary'     && <GlossaryPage onNav={handleNav} />}
      {page === 'weekly'       && <WeeklyPage onNav={handleNav} onIssue={handleWeeklyIssue} />}
      {page === 'weekly-issue' && weeklyIssue && <WeeklyIssuePage issue={weeklyIssue} onNav={handleNav} />}
      {page === 'about'        && <AboutPage onNav={handleNav} />}
      {page === 'saved'        && <SavedPage saved={saved} onArticle={handleArticle} onNav={handleNav} />}
      <SiteFooter onNav={handleNav} />
      <BackToTop />
      <TweaksUI tweaks={tweaks} setTweak={setTweak} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
