<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: oklch(97% 0.008 75);
    --bg-alt: oklch(94% 0.01 75);
    --bg-card: oklch(99% 0.004 75);
    --surface: oklch(100% 0 0);
    --ink: oklch(14% 0.012 60);
    --ink-2: oklch(35% 0.01 60);
    --ink-3: oklch(55% 0.008 60);
    --ink-4: oklch(72% 0.006 60);
    --border: oklch(87% 0.008 75);
    --border-strong: oklch(75% 0.01 75);
    --accent: oklch(44% 0.18 25);
    --accent-hover: oklch(38% 0.20 25);
    --accent-light: oklch(94% 0.04 25);
    --rule: oklch(78% 0.01 60);
    --font-serif: 'Frank Ruhl Libre', 'Playfair Display', Georgia, serif;
    --font-ui: 'Assistant', 'Helvetica Neue', Arial, sans-serif;
    --nav-h: 64px;
    --max-w: 1280px;
    transition: background 0.3s, color 0.3s;
  }

  [data-theme="dark"] {
    --bg: oklch(12% 0.010 240);
    --bg-alt: oklch(16% 0.012 240);
    --bg-card: oklch(18% 0.012 240);
    --surface: oklch(20% 0.014 240);
    --ink: oklch(95% 0.005 80);
    --ink-2: oklch(82% 0.006 80);
    --ink-3: oklch(65% 0.005 80);
    --ink-4: oklch(48% 0.005 80);
    --border: oklch(26% 0.010 240);
    --border-strong: oklch(34% 0.012 240);
    --accent: oklch(62% 0.18 25);
    --accent-hover: oklch(68% 0.20 25);
    --accent-light: oklch(22% 0.06 25);
    --rule: oklch(30% 0.010 240);
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  img { display: block; width: 100%; object-fit: cover; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; font-family: var(--font-ui); }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  /* ─── TOP BAR ─── */
  .top-bar {
    background: var(--ink);
    color: var(--bg);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 6px 0;
    text-align: center;
  }
  .top-bar span { opacity: 0.7; margin: 0 8px; }
  .top-bar a { color: var(--accent); }

  /* ─── NAVBAR ─── */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    height: var(--nav-h);
    transition: background 0.3s, border-color 0.3s, box-shadow 0.2s;
  }
  nav.scrolled { box-shadow: 0 2px 20px oklch(0% 0 0 / 0.08); }
  .nav-inner {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 24px;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 0;
  }
  .nav-logo {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nav-logo em {
    font-style: normal;
    color: var(--accent);
  }
  .nav-divider {
    width: 1px;
    height: 24px;
    background: var(--border-strong);
    margin: 0 20px;
    flex-shrink: 0;
  }
  .nav-links {
    display: flex;
    gap: 0;
    list-style: none;
    flex: 1;
  }
  .nav-links li a {
    display: block;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-2);
    line-height: var(--nav-h);
    border-bottom: 3px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .nav-links li a:hover, .nav-links li a.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: auto;
    margin-left: 0;
  }
  [dir="rtl"] .nav-actions { margin-right: auto; margin-left: 0; }

  .search-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--ink-3);
    transition: border-color 0.2s, background 0.2s;
    min-width: 180px;
  }
  .search-box:focus-within {
    border-color: var(--accent);
    background: var(--surface);
  }
  .search-box input {
    background: none;
    border: none;
    outline: none;
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--ink);
    flex: 1;
    min-width: 0;
  }
  .search-box input::placeholder { color: var(--ink-4); }
  .search-icon { color: var(--ink-4); font-size: 14px; flex-shrink: 0; }

  .theme-toggle {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-2);
    font-size: 16px;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    flex-shrink: 0;
  }
  .theme-toggle:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ─── DATE BAR ─── */
  .date-bar {
    border-bottom: 1.5px solid var(--border);
    padding: 8px 0;
  }
  .date-bar-inner {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--ink-3);
    font-family: var(--font-ui);
  }
  .date-bar-left { font-weight: 600; }
  .date-bar-cats { display: flex; gap: 16px; }
  .date-bar-cats a {
    color: var(--ink-3);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .date-bar-cats a:hover { color: var(--accent); }

  /* ─── HERO ─── */
  .hero-section {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 32px 24px 0;
    border-bottom: 1.5px solid var(--border);
    padding-bottom: 32px;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto auto;
    gap: 0 32px;
  }
  .hero-main { grid-column: 1; grid-row: 1 / 3; }
  .hero-main a { display: block; }
  .hero-main-img {
    aspect-ratio: 16/9;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .hero-main-img img {
    height: 100%;
    transition: transform 0.5s ease;
  }
  .hero-main:hover .hero-main-img img { transform: scale(1.03); }
  .hero-tag {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-bottom: 12px;
  }
  .hero-main-title {
    font-family: var(--font-serif);
    font-size: clamp(26px, 3vw, 38px);
    font-weight: 700;
    line-height: 1.25;
    color: var(--ink);
    margin-bottom: 12px;
    text-wrap: pretty;
  }
  .hero-main:hover .hero-main-title { color: var(--accent); }
  .hero-main-excerpt {
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink-2);
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-3);
    font-weight: 600;
  }
  .hero-meta-dot { color: var(--rule); }

  /* Hero side stack */
  .hero-side { display: flex; flex-direction: column; gap: 0; }
  .hero-side-item {
    display: flex;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .hero-side-item:first-child { padding-top: 0; }
  .hero-side-item:last-child { border-bottom: none; }
  .hero-side-img {
    width: 88px;
    height: 66px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .hero-side-img img { height: 100%; transition: transform 0.3s; }
  .hero-side-item:hover .hero-side-img img { transform: scale(1.05); }
  .hero-side-content { flex: 1; min-width: 0; }
  .hero-side-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 5px;
  }
  .hero-side-title {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--ink);
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hero-side-item:hover .hero-side-title { color: var(--accent); }
  .hero-side-meta { font-size: 12px; color: var(--ink-4); }

  /* ─── SECTION HEADER ─── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }
  .section-header-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .section-header-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-header-title::before {
    content: '';
    display: block;
    width: 4px;
    height: 22px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .section-header-more {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: opacity 0.2s;
  }
  .section-header-more:hover { opacity: 0.75; }

  /* ─── MAIN LAYOUT ─── */
  .main-content {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 40px 24px;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 48px;
    align-items: start;
  }

  /* ─── CARD GRID ─── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border);
    transition: box-shadow 0.25s, transform 0.25s, border-color 0.25s;
    cursor: pointer;
  }
  .card:hover {
    box-shadow: 0 6px 28px oklch(0% 0 0 / 0.10);
    transform: translateY(-3px);
    border-color: var(--border-strong);
  }
  .card-img { aspect-ratio: 16/10; overflow: hidden; }
  .card-img img { height: 100%; transition: transform 0.5s ease; }
  .card:hover .card-img img { transform: scale(1.06); }
  .card-body { padding: 16px 18px 20px; flex: 1; display: flex; flex-direction: column; }
  .card-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .card-title {
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--ink);
    margin-bottom: 10px;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-wrap: pretty;
  }
  .card:hover .card-title { color: var(--accent); }
  .card-excerpt {
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--ink-3);
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-4);
    font-weight: 600;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: auto;
  }
  .card-meta-dot { color: var(--rule); }

  /* ─── LIST CARDS (for article page sidebar or additional) ─── */
  .list-card {
    display: flex;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .list-card:last-child { border-bottom: none; }
  .list-card:hover { opacity: 0.8; }
  .list-card-img {
    width: 80px;
    height: 60px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .list-card-img img { height: 100%; }
  .list-card-title {
    font-family: var(--font-serif);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .list-card:hover .list-card-title { color: var(--accent); }
  .list-card-meta { font-size: 12px; color: var(--ink-4); }

  /* ─── SIDEBAR ─── */
  .sidebar { display: flex; flex-direction: column; gap: 32px; }
  .sidebar-widget {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 20px;
  }
  .sidebar-widget-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .newsletter-form { display: flex; flex-direction: column; gap: 10px; }
  .newsletter-desc { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); margin-bottom: 4px; }
  .newsletter-input {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    text-align: right;
    direction: rtl;
  }
  .newsletter-input:focus { border-color: var(--accent); }
  .newsletter-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 700;
    font-family: var(--font-ui);
    cursor: pointer;
    transition: background 0.2s;
    border-radius: 2px;
  }
  .newsletter-btn:hover { background: var(--accent-hover); }

  .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-pill {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .tag-pill:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ─── ARTICLE PAGE ─── */
  .article-page { display: none; }
  .article-page.active { display: block; }
  .article-header {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 40px 24px 0;
    max-width: 860px;
  }
  .article-breadcrumb {
    font-size: 13px;
    color: var(--ink-3);
    margin-bottom: 20px;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .article-breadcrumb a { color: var(--accent); font-weight: 600; }
  .article-cat {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    margin-bottom: 18px;
  }
  .article-title {
    font-family: var(--font-serif);
    font-size: clamp(28px, 4vw, 46px);
    font-weight: 900;
    line-height: 1.2;
    color: var(--ink);
    margin-bottom: 18px;
    text-wrap: pretty;
    max-width: 780px;
  }
  .article-subtitle {
    font-size: 19px;
    line-height: 1.6;
    color: var(--ink-2);
    margin-bottom: 20px;
    max-width: 700px;
    font-family: var(--font-serif);
    font-weight: 400;
    font-style: italic;
  }
  .article-meta-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    font-size: 14px;
    color: var(--ink-3);
  }
  .article-author { font-weight: 700; color: var(--ink); }
  .article-meta-dot { color: var(--rule); }
  .article-hero-img {
    max-width: 860px;
    margin: 0 auto 40px;
    padding: 0 24px;
  }
  .article-hero-img img { width: 100%; aspect-ratio: 16/8; object-fit: cover; }
  .article-img-caption {
    font-size: 12px;
    color: var(--ink-4);
    margin-top: 8px;
    font-style: italic;
    text-align: center;
  }
  .article-body {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 40px;
    align-items: start;
  }

// ─── TOC HELPERS ────────────────────────────────────────────────────────────

function processBodyWithIds(html) {
  let idx = 0;
  const headings = [];
  const processed = html.replace(/<(h[23])([^>]*)>([\s\S]*?)<\/h[23]>/gi, (_, tag, attrs, inner) => {
    const id = `sec-${idx++}`;
    const text = inner.replace(/<[^>]+>/g, '').trim();
    headings.push({ id, text, level: parseInt(tag[1]) });
    return `<${tag}${attrs} id="${id}">${inner}</${tag}>`;
  });
  return { html: processed, headings };
}

function TOCWidget({ headings }) {
  const [activeId, setActiveId] = React.useState(null);

  React.useEffect(() => {
    if (!headings.length) return;
    const io = new IntersectionObserver(
      entries => {
        entries.forEach(e => { if (e.isIntersecting) setActiveId(e.target.id); });
      },
      { rootMargin: '-15% 0px -70% 0px' }
    );
    headings.forEach(h => { const el = document.getElementById(h.id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, [headings]);

  if (headings.length < 3) return null;

  return (
    <div className="sidebar-widget">
      <div className="sidebar-widget-title" style={{fontSize:'13px'}}>תוכן עניינים</div>
      <nav aria-label="תוכן עניינים">
        {headings.map(h => (
          <a
            key={h.id}
            href={`#${h.id}`}
            onClick={e => { e.preventDefault(); document.getElementById(h.id)?.scrollIntoView({ behavior: 'smooth' }); }}
            style={{
              display: 'block',
              fontSize: h.level === 3 ? '12px' : '13px',
              padding: h.level === 3 ? '3px 20px 3px 0' : '4px 10px 4px 0',
              borderRight: h.level === 2 ? '2px solid var(--accent)' : '2px solid transparent',
              color: activeId === h.id ? 'var(--accent)' : 'var(--ink-2)',
              fontWeight: activeId === h.id ? '700' : '400',
              transition: 'color 0.15s',
              textDecoration: 'none',
            }}
          >
            {h.text}
          </a>
        ))}
      </nav>
    </div>
  );
}

// ─── SAVED HOOK ──────────────────────────────────────────────────────────────

function useSaved() {
  const [saved, setSaved] = useState(() => {
    try { return JSON.parse(localStorage.getItem('blog-saved') || '[]'); } catch { return []; }
  });
  const toggle = (article) => setSaved(prev => {
    const next = prev.some(a => a.id === article.id)
      ? prev.filter(a => a.id !== article.id)
      : [...prev, { id: article.id, title: article.title, excerpt: article.excerpt, date: article.date, category: article.category, catEn: article.catEn, img: article.img, readTime: article.readTime, tags: article.tags }];
    localStorage.setItem('blog-saved', JSON.stringify(next));
    return next;
  });
  const isSaved = (id) => saved.some(a => a.id === id);
  return { saved, toggle, isSaved };
}

// ─── SHARE BUTTONS ────────────────────────────────────────────────────────────

function ShareButtons({ article }) {
  const [copied, setCopied] = useState(false);
  const url = `https://erezfinkel.github.io/#article-${article.id}`;
  const encoded = encodeURIComponent(url);
  const title = encodeURIComponent(article.title);

  const copyLink = () => {
    navigator.clipboard.writeText(url).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  };

  return (
    <div className="share-bar" dir="rtl">
      <span className="share-label">שתפו:</span>
      <a className="share-btn" href={`https://twitter.com/intent/tweet?text=${title}&url=${encoded}`} target="_blank" rel="noopener noreferrer" aria-label="שתף ב-X">
        <IconX /> X / Twitter
      </a>
      <a className="share-btn" href={`https://www.linkedin.com/sharing/share-offsite/?url=${encoded}`} target="_blank" rel="noopener noreferrer" aria-label="שתף ב-LinkedIn">
        <IconLinkedIn /> LinkedIn
      </a>
      <a className="share-btn" href={`https://wa.me/?text=${title}%20${encoded}`} target="_blank" rel="noopener noreferrer" aria-label="שתף ב-WhatsApp">
        <IconWhatsApp /> WhatsApp
      </a>
      <button className={`share-btn${copied ? ' copied' : ''}`} onClick={copyLink} aria-label="העתק קישור">
        <IconLink /> {copied ? '✓ הועתק!' : 'העתק קישור'}
      </button>
    </div>
  );
}

function RelatedPosts({ article, onArticle }) {
  const related = ARTICLES
    .filter(a => a.id !== article.id)
    .map(a => ({ ...a, _score: (a.tags || []).filter(t => (article.tags || []).includes(t)).length }))
    .sort((a, b) => b._score - a._score)
    .slice(0, 3);

  if (!related.length) return null;

  return (
    <section className="related-section" aria-label="כתבות קשורות">
      <div className="section-header">
        <div className="section-header-title">כתבות קשורות</div>
        <div className="section-header-line"></div>
      </div>
      <div className="related-grid">
        {related.map(a => <ArticleCard key={a.id} article={a} onArticle={onArticle} />)}
      </div>
    </section>
  );
}

function BackToTop() {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const onScroll = () => setVisible(window.scrollY > 600);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <button
      className={`back-to-top${visible ? ' visible' : ''}`}
      onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
      aria-label="חזרה לראש הדף"
    >
      <IconArrowUp />
    </button>
  );
}

function ArticleReadingBar() {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const el = document.documentElement;
      const total = el.scrollHeight - el.clientHeight;
      setProgress(total > 0 ? (window.scrollY / total) * 100 : 0);
    };
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <div className="article-reading-bar">
      <div className="article-reading-progress" style={{ width: `${progress}%` }}></div>
    </div>
  );
}

  // Inject article JSON-LD into <head> and clean up on unmount / article change

    const tag = document.createElement('script');
    tag.type = 'application/ld+json';
    tag.id = 'article-jsonld';
    tag.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Article",
          "headline": article.title,
          "description": article.excerpt,
          "image": article.img,
          "url": `https://erezfinkel.github.io/#article-${article.id}`,
          "inLanguage": "he",
          "author": {
            "@type": "Person",
            "@id": "https://erezfinkel.github.io/#author",
            "name": "ארז פינקל"

            "name": "בלוג ה-AI של ארז",
            "url": "https://erezfinkel.github.io"
          }

          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "ראשי", "item": "https://erezfinkel.github.io" },
            { "@type": "ListItem", "position": 2, "name": article.category, "item": `https://erezfinkel.github.io/#${article.catEn.toLowerCase()}` },
            { "@type": "ListItem", "position": 3, "name": article.title, "item": `https://erezfinkel.github.io/#article-${article.id}` }
          ]
        }
      ]
    });
    document.getElementById('article-jsonld')?.remove();
    document.head.appendChild(tag);

  const rawBody = `

    <p>המחקרים האחרונים מראים כי הטמעה נכונה של AI יכולה להגדיל פריון ב-40% ויותר, אך המפתח נמצא בגישה האסטרטגית ובהכשרת האנשים.</p>
    <h2>מה זה אומר בפרקטיקה</h2>
    <p>ארגונים שמצליחים להטמיע AI בצורה אפקטיבית משתפים מספר מאפיינים משותפים: מנהיגות שמאמינה בטכנולוגיה, תרבות של ניסוי ולמידה, ותשומת לב מיוחדת לאיכות הנתונים.</p>
    <h2>מה הלאה?</h2>
    <p>המגמות מראות שהשנים הקרובות יהיו מכוננות. הכלים שמגיעים כיום לשוק יעצבו את אופי העבודה, היצירה וקבלת ההחלטות לדור הבא.</p>
  `;

  const { html: body, headings } = processBodyWithIds(rawBody);

  return (
    <div className="page active">

// ─── TWEAKS ─────────────────────────────────────────────────────────────────
function TweaksUI({ tweaks, setTweak }) {
  return (
    <TweaksPanel>
      <TweakSection title="צבעים">
        <TweakColor label="צבע אקסנט" id="accentColor" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
      </TweakSection>
      <TweakSection title="טיפוגרפיה">
        <TweakSelect label="פונט גוף" id="fontBody" value={tweaks.fontBody} onChange={v => setTweak('fontBody', v)}
          options={[
            {value:'Frank Ruhl Libre', label:'Frank Ruhl Libre'},
            {value:'Playfair Display', label:'Playfair Display'},
            {value:'Georgia', label:'Georgia'},
          ]}
        />
      </TweakSection>
      <TweakSection title="פריסה">
        <TweakToggle label="מצב כהה" id="darkMode" value={tweaks.darkMode} onChange={v => setTweak('darkMode', v)} />
        <TweakToggle label="הצג סרגל עליון" id="showTopBar" value={tweaks.showTopBar} onChange={v => setTweak('showTopBar', v)} />
      </TweakSection>
    </TweaksPanel>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const tweaksResult = useTweaks(TWEAK_DEFAULTS);
  const tweaks = tweaksResult?.tweaks ?? TWEAK_DEFAULTS;
  const setTweak = tweaksResult?.setTweak ?? (() => {});
  const [page, setPage] = useState('home');
  const [article, setArticle] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');
  const { saved, toggle: toggleSaved, isSaved } = useSaved();

  const dark = tweaks.darkMode;

  // Apply theme
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);

  // Apply accent color
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accentColor);
  }, [tweaks.accentColor]);

  // Apply font
  useEffect(() => {
    document.documentElement.style.setProperty('--font-serif', `'${tweaks.fontBody}', Georgia, serif`);
  }, [tweaks.fontBody]);

  const handleNav = (id) => {
    setPage(id);
    setArticle(null);
    setSearchQuery('');
    window.scrollTo(0,0);
  };

  const handleArticle = (a) => {
    setArticle(a);
    setPage('article');
    window.scrollTo(0,0);
  };

  const handleSearch = (q) => {
    setSearchQuery(q);
    if (q && page !== 'home') setPage('home');
  };

  return (
    <>
      {tweaks.showTopBar && (
        <div className="top-bar">
          <span>חדש:</span> GPT-5.5 הגיע — <a href="#">קראו את הסקירה המלאה</a>
          <span>|</span>
          <span>גוגל תשקיע 40B$ ב-Anthropic</span>
        </div>
      )}
      <NavBar
        dark={dark}
        toggleDark={() => setTweak('darkMode', !dark)}
        onNav={handleNav}
        page={page}
        searchQuery={searchQuery}
        setSearchQuery={handleSearch}
        savedCount={saved.length}
      />
      {page === 'home'    && <HomePage onArticle={handleArticle} searchQuery={searchQuery} />}
      {page === 'article' && article && <ArticlePage article={article} onBack={() => handleNav('home')} onArticle={handleArticle} isSaved={isSaved} toggleSaved={toggleSaved} />}
      {page === 'news'    && <NewsPage onArticle={handleArticle} />}
      {page === 'guides'  && <GuidesPage onArticle={handleArticle} />}
      {page === 'tools'   && <ToolsPage />}
      {page === 'about'   && <AboutPage />}
      {page === 'saved'   && <SavedPage saved={saved} onArticle={handleArticle} onNav={handleNav} />}
      <SiteFooter onNav={handleNav} />
      <BackToTop />
      <TweaksUI tweaks={tweaks} setTweak={setTweak} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
